# Community plugins I run alongside the mods in this repo, pinned to the commits I use.
#   hermes plugins pack show hermes-pack.yaml      # dry run
#   hermes plugins pack install hermes-pack.yaml   # or: ./install.sh --community
# Each plugin still asks for its own capability consent.
name: hermes-mods-community
description: Community Hermes plugins that go with daveey/hermes-mods.
version: 1.0.0
plugins:
  # /errors: local ledger of failed provider calls (rate limits, overloads, timeouts)
  - repo: olric3015/hermes-plugins
    ref: 732cf2268b43b8d99c385912f9a50af149cad0ee
    subdir: error-ledger
  # /break, /break {msg}, /again for a stalled tool call without killing the turn (mod+shift+b)
  - repo: apoapostolov/hermes-agent-awesome-plugins
    ref: 953732a9fb52b6fd89e73fc96d910aab63163e07
    subdir: public/intelligent-tool-break
  # Desktop: subscription quota and reset-time tracker
  - repo: Adolanium/hermes-resetwatch
    ref: d460334db633fbaa91f0f8b96679e8463bad2a04
    subdir: catalog
  # Desktop: browse Tailscale devices and connect to remote Hermes instances
  - repo: Adolanium/hermes-tailscale
    ref: 7a0b5ab13ec7bd97bebdbfb638acfb5c40ad1f06
    subdir: catalog
  # Desktop: GitHub PRs & issues as a right-hand pane (uses your gh CLI)
  - repo: claudiumio/githermes
    ref: 09d5b566da650290dc0d639ea1e77def4bcdab31
  # Desktop: session trace, cost, provider usage, runtime health
  - repo: abualnassr/hermes-session-lens
    ref: 69bc2b183fd376acf27256cd9b43f578a16388ae
  # Desktop status bar: Kanban worker health and provider quota
  - repo: mr-3mm3/hermes-monitor
    ref: ec6a3ada338ca3e06fbfc246bc672c3c776b0988
