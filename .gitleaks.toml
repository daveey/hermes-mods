[extend]
useDefault = true

[allowlist]
description = "sha256 fingerprints of Hermes core files (compatibility guards), and a named test fixture in core patch 0134, not secrets"
paths = ['''(^|/)(execution-|account-usage-)?compatibility\.json$''']
regexTarget = "line"
regexes = ['''last_error_message=SECRET_MESSAGE, failure_reason="rate_limit"''']
