[extend]
useDefault = true

[allowlist]
description = "sha256 fingerprints of Hermes core files (compatibility guards), and named test fixtures in core patches 0134 and 0740, not secrets"
paths = ['''(^|/)(execution-|account-usage-)?compatibility\.json$''']
regexTarget = "line"
regexes = ['''last_error_message=SECRET_MESSAGE, failure_reason="rate_limit"''', '''relay_turn_id="session-key:t:replay"''']
