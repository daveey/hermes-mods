[extend]
useDefault = true

[allowlist]
description = "sha256 fingerprints of Hermes core files (compatibility guards), and named test fixtures in core patches 0134, 0740 and 1056, and the config key name nightly_e2e.failure_key quoted in patches 1393 and 1395, not secrets"
paths = ['''(^|/)(execution-|account-usage-)?compatibility\.json$''']
regexTarget = "line"
regexes = ['''last_error_message=SECRET_MESSAGE, failure_reason="rate_limit"''', '''relay_turn_id="session-key:t:replay"''', '''api_key="test-key-1234567890", provider="openrout''', '''key = ``nightly_e2e\.failure_key``''']
