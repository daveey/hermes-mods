<!doctype html>
<html lang="__UI_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f1e4">
<meta name="mobile-web-app-capable" content="yes">
<title>__TITLE__</title>
<style>
:root{
  --paper:#f6f1e4; --paper-2:#efe8d6; --card:#fffdf6; --ink:#1d2618; --muted:#66705c; --line:#e3dac6;
  --accent:#3f8a24; --accent-ink:#fff; --pop:#ff8a3d; --pop-deep:#d0661c;
  --r-lg:26px; --r-md:18px;
  --round: ui-rounded,"SF Pro Rounded","Nunito","Avenir Next","Varela Round",-apple-system,system-ui,"Helvetica Neue",sans-serif;
  --book: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--round);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

.app{min-height:100dvh;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px 10px}
.mark{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.topic{display:flex;flex-direction:column;min-width:0}
.topic b{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic small{font-size:12px;color:var(--muted)}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700}
.pill[aria-pressed=false]{color:var(--muted)}
.pill svg{width:18px;height:18px}

.grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"segs" "stage" "cap" "story" "dock"}

/* stage */
.stage{grid-area:stage;position:relative;margin:0 12px;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:var(--paper-2);
  box-shadow:0 1px 0 #fff inset,0 18px 40px -22px #3a4a2a66,0 2px 6px -2px #3a4a2a33;touch-action:pan-y}
.stage svg.art{display:block;width:100%;height:100%}
.stage.paused *{animation-play-state:paused!important}
#scene{transition:opacity .35s ease}
#scene.out{opacity:0}
.segs{grid-area:segs;display:flex;gap:5px;margin:0 18px 10px;pointer-events:none}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.segs i b{display:block;height:100%;width:0;background:var(--accent)}
.overlay{position:absolute;bottom:12px;right:12px;z-index:3;display:flex;gap:6px}
.overlay button{height:34px;padding:0 13px;border-radius:999px;border:0;background:#ffffffe6;font-size:14px;font-weight:700;color:#28401a;box-shadow:0 2px 8px -2px #0003}
.overlay button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.cover{position:fixed;inset:0;z-index:20;border:0;margin:0;display:flex;flex-direction:column;align-items:stretch;gap:0;text-align:left;
  background:var(--paper);color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));overflow:auto}
.cover .art-c{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1/1;max-height:50dvh;width:100%;background:var(--paper-2);box-shadow:0 18px 40px -22px #3a4a2a66}
.cover .art-c svg{display:block;width:100%;height:100%}
.cover .txt{display:flex;flex-direction:column;gap:10px;padding:22px 6px 0;flex:1}
.cover .k{margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cover h1{margin:0;font-size:clamp(32px,9vw,54px);line-height:1;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.cover .m{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.cover .go{display:flex;justify-content:center;align-self:stretch;align-items:center;gap:12px;margin-top:auto;height:62px;padding:0 28px 0 11px;border-radius:999px;background:var(--pop);color:#fff;
  box-shadow:0 5px 0 var(--pop-deep);font-size:23px;font-weight:800;animation:bob 1.8s ease-in-out infinite}
.cover .go span{width:42px;height:42px;border-radius:50%;background:#fff3;display:grid;place-items:center}
.cover .go svg{width:18px;height:18px;margin-left:3px}
.cover .h{margin:0;font-size:13px;color:var(--muted)}
.cover.gone{display:none}
@keyframes bob{50%{transform:translateY(-4px)}}

/* caption (narration, karaoke) */
.cap{grid-area:cap;margin:14px 18px 0;font-size:21px;line-height:1.42;font-weight:600;max-height:4.4em;overflow:hidden;position:relative;scroll-behavior:smooth;text-wrap:pretty}
.cap span{color:#1d261855;transition:color .25s}
.cap span.past{color:#1d261888}
.cap span.on{color:var(--ink)}
.cap:empty{display:none}

/* story card */
.story{grid-area:story;margin:14px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px 18px}
.kick{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.story h2{margin:4px 0 6px;font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.story p{margin:0;font-size:16px;line-height:1.5;color:#2c3626;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--paper);color:var(--muted)}
.toc{display:none}
.src{margin-top:14px;font-size:12px;color:var(--muted)}
.src a{color:inherit}

/* dock */
.dock{grid-area:dock;align-self:end;position:sticky;bottom:0;z-index:6;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:18px;
  padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock .nb{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.dock .nb svg{width:22px;height:22px}
.dock .play{width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.dock .play:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.dock .play svg{width:26px;height:26px}
.dock .count{position:absolute;right:18px;font-size:13px;font-weight:700;color:var(--muted)}

/* desktop */
@media (min-width:920px){
  .top{padding:22px 28px 14px}
  .grid{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto 1fr;column-gap:28px;padding:0 28px 28px;
    grid-template-areas:"segs story" "stage story" "cap story" "dock story"}
  .segs{margin:0 4px 12px}
  .stage{margin:0}
  .cap{margin:18px 4px 0;font-size:24px;max-height:none}
  .story{margin:0;align-self:start;position:sticky;top:20px;padding:22px}
  .story h2{font-size:32px}
  .toc{display:flex;flex-direction:column;gap:2px;margin:18px -8px 0;border-top:1px solid var(--line);padding-top:12px}
  .toc button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px;border-radius:12px;text-align:left}
  .toc button:hover{background:var(--paper)}
  .toc button i{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;background:var(--paper);color:var(--muted)}
  .toc button b{font-size:15px;font-weight:700}
  .toc button small{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .toc button.done i{background:color-mix(in srgb,var(--accent) 18%,#fff);color:var(--accent)}
  .toc button[aria-current=true] i{background:var(--accent);color:#fff}
  .dock{position:static;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;justify-content:flex-start;padding:18px 4px 0;margin:0;gap:14px}
  .dock .count{position:static;margin-left:auto}
  .cover{position:absolute;padding:0;background:none;color:#fff;justify-content:flex-end;overflow:hidden}
  .cover .art-c{position:absolute;inset:0;aspect-ratio:auto;max-height:none;border-radius:0;box-shadow:none}
  .cover .art-c::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 10%,#13200d40 40%,#13200de6 100%)}
  .cover .txt{position:relative;flex:none;padding:34px 38px 34px;gap:12px}
  .cover .k{color:#fff;opacity:.85}.cover .m,.cover .h{color:#ffffffd0}
  .cover h1{font-size:52px;max-width:15ch;text-shadow:0 2px 18px #0006}
  .cover .go{margin-top:8px;align-self:flex-start;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.stage *,.cover .go{animation:none!important;transition:none!important}}
__CSS__
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16Z" fill="#fff"/><path d="M5 19 14 10" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></svg></div>
    <div class="topic"><b id="topic"></b><small id="meta"></small></div>
    <button class="pill" id="snd" aria-pressed="true"></button>
  </header>
  <main class="grid">
    <div class="segs" id="segs"></div>
    <section class="stage" id="stage">
      <svg class="art" viewBox="0 0 640 360" role="img" aria-label="Illustration"><defs>__DEFS__</defs><g id="scene"></g></svg>
      <div class="overlay" id="overlay"></div>
      <button class="cover" id="cover"><div class="art-c" id="coverArt"></div><div class="txt"><p class="k" id="coverKick"></p><h1 id="coverTitle"></h1><p class="m" id="coverMeta"></p><span class="go"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span><em id="coverGo" style="font-style:normal"></em></span><p class="h" id="coverHint"></p></div></button>
    </section>
    <div class="cap" id="cap" aria-live="polite"></div>
    <aside class="story">
      <div class="kick" id="kick"></div>
      <h2 id="title"></h2>
      <p id="body"></p>
      <div class="chips" id="chips"></div>
      <nav class="toc" id="toc"></nav>
      <div class="src" id="src"></div>
    </aside>
    <footer class="dock">
      <button class="nb" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="play" id="play" aria-label="Play"></button>
      <button class="nb" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="count" id="count"></span>
    </footer>
  </main>
</div>
<script>
__EXPLAINER__
</script>
<script>
(() => {
const X = EXPLAINER, NARR = __NARR__, AUDIO = __AUDIO__, DUR = __DUR__;
const N = X.scenes.length, $ = id => document.getElementById(id);
const I = {play:'<svg viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor"/></svg>',
  again:'<svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M5 3v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  on:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  off:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'};
const hasAudio = AUDIO.length === N;
const lines = NARR.length === N ? NARR : X.scenes.map(s => s.narration || '');
const durOf = i => DUR[i] || Math.max(8, lines[i].length / 14);
const SENT = lines.map((t, i) => { const parts = t.match(/[^.!?…]+[.!?…]+[»”"]?\s*|[^.!?…]+$/g) || [t]; let c = 0;
  return parts.map(p => { const s = {text: p, start: c / Math.max(1, t.length) * durOf(i)}; c += p.length; return s; }); });

let idx = 0, started = false, playing = false, sound = hasAudio, timers = [], base = 0, mark = performance.now(), ended = false;
const audio = new Audio(); audio.preload = 'auto';
const narrating = () => started && sound && hasAudio;
const clock = () => narrating() ? audio.currentTime : base + (playing ? (performance.now() - mark) / 1000 : 0);
const resetClock = () => { base = 0; mark = performance.now(); };
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const every = (fn, ms) => timers.push(setInterval(fn, ms));
const clearT = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };
const cue = (i, needle) => { const k = lines[i].indexOf(needle); return k < 0 ? 0 : k / lines[i].length * durOf(i); };
const ctxFor = i => ({ $, cue: n => cue(i, n), clock, every, later, overlay: $('overlay'), dur: durOf(i), narrating,
  set: o => { if (o.title != null) $('title').textContent = o.title; if (o.body != null) $('body').innerHTML = o.body; } });

/* static chrome */
if (X.defs) document.querySelector('svg.art defs').insertAdjacentHTML('beforeend', X.defs);
document.documentElement.style.setProperty('--accent', X.accent || '#3f8a24');
$('topic').textContent = X.title;
const mins = Math.max(1, Math.round(lines.reduce((a, _, i) => a + durOf(i), 0) / 60));
$('meta').textContent = (X.meta || '%n chapters · %m min').replace('%n', N).replace('%m', mins);
$('coverKick').textContent = X.coverKick || '';
$('coverMeta').textContent = $('meta').textContent;
{ const s0 = X.scenes[X.coverScene || 0], wide = matchMedia('(min-width:920px)').matches;
  $('coverArt').innerHTML = `<svg viewBox="${wide ? '0 0 640 360' : (X.coverViewBox || '0 0 640 360')}" preserveAspectRatio="xMidYMid slice">${s0.svg(ctxFor(0))}</svg>`; }
$('coverTitle').textContent = X.coverTitle || X.title;
$('coverGo').textContent = hasAudio ? (X.playLabel || 'Play') : (X.playLabelSilent || 'Start');
$('coverHint').textContent = hasAudio ? (X.playHint || '') : '';
$('src').innerHTML = X.sources ? 'Facts: ' + X.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join(' · ') : '';
$('segs').innerHTML = X.scenes.map(() => '<i><b></b></i>').join('');
$('toc').innerHTML = X.scenes.map((s, k) => `<button data-k="${k}"><i>${k + 1}</i><span><b>${s.title}</b><small>${s.kick}</small></span></button>`).join('');
if (!hasAudio) $('snd').style.display = 'none';
const paintSnd = () => { $('snd').innerHTML = (sound ? I.on : I.off) + (X.langLabel || 'Audio'); $('snd').setAttribute('aria-pressed', sound); };
const paintPlay = () => { $('play').innerHTML = ended ? I.again : playing ? I.pause : I.play; $('play').setAttribute('aria-label', ended ? 'Play again' : playing ? 'Pause' : 'Play');
  $('stage').classList.toggle('paused', !playing && started); };

function show(i) {
  idx = (i + N) % N; ended = false; const s = X.scenes[idx];
  clearT(); audio.pause(); $('overlay').innerHTML = '';
  const scene = $('scene'), had = !!scene.innerHTML;
  if (had) scene.classList.add('out');
  setTimeout(() => {
    const ctx = ctxFor(idx);
    scene.innerHTML = s.svg(ctx);
    $('kick').textContent = s.kick; $('title').textContent = s.title; $('body').innerHTML = s.body || '';
    $('chips').innerHTML = (s.chips || []).map(c => `<span>${c}</span>`).join('');
    $('cap').innerHTML = started ? SENT[idx].map(p => `<span>${p.text}</span>`).join('') : '';
    $('cap').setAttribute('lang', X.narrationLang || 'en'); $('cap').scrollTop = 0;
    $('count').textContent = `${idx + 1} / ${N}`;
    [...$('toc').children].forEach((b, k) => { b.setAttribute('aria-current', k === idx); b.classList.toggle('done', k < idx); });
    [...$('segs').children].forEach((g, k) => g.firstChild.style.width = k < idx ? '100%' : '0');
    resetClock();
    if (narrating()) { audio.src = AUDIO[idx]; audio.currentTime = 0; if (playing) audio.play().catch(() => { playing = false; paintPlay(); }); }
    if (s.enter) s.enter(ctx);
    scene.classList.remove('out'); paintPlay();
  }, had ? 300 : 0);
}
function finish() { playing = false; ended = true; paintPlay(); }
audio.addEventListener('ended', () => { if (!playing) return; if (idx === N - 1) return finish(); later(() => show(idx + 1), 1200); });

let lastSent = -1;
function tick() {
  const t = clock(), d = narrating() && audio.duration ? audio.duration : durOf(idx) + 1.2, p = Math.min(1, t / d);
  const seg = $('segs').children[idx]; if (seg) seg.firstChild.style.width = (p * 100) + '%';
  if (started) { let k = 0; SENT[idx].forEach((s, j) => { if (t >= s.start) k = j; });
    if (k !== lastSent || t < .05) { lastSent = k; const spans = $('cap').children;
      [...spans].forEach((el, j) => { el.className = j < k ? 'past' : j === k ? 'on' : ''; });
      const el = spans[k]; if (el) $('cap').scrollTop = Math.max(0, el.offsetTop - 4); } }
  if (playing && started && !narrating() && t >= d) { if (idx === N - 1) finish(); else show(idx + 1); }
  requestAnimationFrame(tick);
}
function play() { if (ended) { ended = false; playing = true; show(0); return; }
  playing = true; mark = performance.now(); if (narrating()) { if (!audio.src) audio.src = AUDIO[idx]; audio.play().catch(() => {}); } paintPlay(); }
function pause() { base = clock(); playing = false; audio.pause(); paintPlay(); }
function begin() { if (started) return; started = true; $('cover').classList.add('gone'); }
const go = k => { begin(); if (!playing && !ended) playing = true; show(k); };

$('cover').onclick = () => { begin(); playing = true; show(idx); };
$('play').onclick = () => { if (!started) return $('cover').click(); playing ? pause() : play(); };
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
$('toc').onclick = e => { const b = e.target.closest('button'); if (b) go(+b.dataset.k); };
$('snd').onclick = () => { sound = !sound; paintSnd();
  if (!sound) { base = audio.currentTime || 0; mark = performance.now(); audio.pause(); }
  else if (started) { const t = clock(); audio.src = AUDIO[idx]; audio.currentTime = Math.min(t, (DUR[idx] || 1) - .2); if (playing) audio.play().catch(() => {}); } };
let sx = null, sy = 0;
$('stage').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
$('stage').addEventListener('pointerup', e => { if (sx == null || !started) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dy) < 45) go(idx + (dx < 0 ? 1 : -1)); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key === ' ') { e.preventDefault(); $('play').click(); } else if (e.key === 'm') $('snd').click(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });

const qs = new URLSearchParams(location.search);
if (qs.has('s')) { idx = +qs.get('s'); started = true; $('cover').classList.add('gone'); }
paintSnd(); show(idx); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
