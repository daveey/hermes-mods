name: slack-reply
label: Slack reply
fields:
  channel:  {required: true}
  thread:   {}
  reply_to: {}
  reply:    {required: true, preview: true}
actions:
  - id: post
    label: Post reply
    icon: send
    style: primary
    kind: prompt
    prompt: "{{accept_prompt}}"
  - id: post_edited
    label: Edit & post…
    icon: edit
    kind: prompt
    input: {placeholder: The exact reply to post, multiline: true}
    prompt: "Post this reply as the bot with slack_post(channel='{{channel}}', thread_ts='{{thread}}', reply_to='{{reply_to}}', text=<exactly the text below, unchanged>), then confirm the returned ts.\n\nReply text:\n{{input}}"
  - {id: ignore, label: Ignore, icon: close, kind: resolve, row: true}
