skill: kanban-red-sweep
should_load:
- ask: there are 110 not-ready tasks, audit them and figure out how to unblock. use your best judgement
  source: session
- ask: sweep all the red cards on every board, clear what you can and then ask me about the rest
  source: hand
- ask: why are so many cards sitting in todo and scheduled? find the stuck ones and get them moving
  source: hand
near_miss:
- ask: what do you need me to do? one checklist of the things only I can fix
  instead: kanban-hands-digest
- ask: break this migration into kanban cards for the right specialists
  instead: kanban-orchestrator
reviewed: true
mined_from_sessions: 1
