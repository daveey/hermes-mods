name: coach-improvement
label: Coach improvement
fields:
  id: {required: true}
actions:
  - id: review
    label: Review
    icon: search
    style: primary
    kind: prompt
    prompt: "{{accept_prompt}}"
  - {id: keep, label: Keep, icon: check, kind: resolve, row: true}
  - id: undo
    label: Undo
    icon: discard
    kind: task
    confirm: Undo this improvement now?
    prompt: "Undo coach improvement {{id}}: run `python3 ~/code/hermes-mods/skills/productivity/hermes-coach/scripts/coach_apply.py revert {{id}} \"undone from the Inbox\"`, then reply with the command's output."
  - {id: not_now, label: Not now, icon: clock, kind: resolve}
  - id: never
    label: Never
    icon: circle-slash
    style: danger
    kind: resolve
    confirm: Never propose this kind of change again, and undo it if it is live?
