name: selfheal
label: Self-heal proposal
fields:
  fp: {required: true}
actions:
  - id: do_it
    label: Do it
    icon: play
    style: primary
    kind: task
    title: "self-heal Do it: {{fp}}"
    confirm: Start the fix card for this defect now?
    prompt: "Self-heal Do it for defect {{fp}}. Run exactly `python3 ~/code/hermes-mods/plugins/coach/self_heal.py fix {{fp}}` once, then complete this card with the command's JSON output as the summary. Do not work on the fix yourself: that command files the fix card (selfheal:{{fp}}:fix), which ships it."
  - {id: not_now, label: Not now, icon: clock, kind: resolve}
  - id: never
    label: Never
    icon: circle-slash
    style: danger
    kind: resolve
    confirm: Never file this defect again?
