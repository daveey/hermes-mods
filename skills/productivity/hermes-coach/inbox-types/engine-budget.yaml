name: engine-budget
label: Engine budget
fields:
  day: {required: true}
actions:
  - id: raise
    label: Raise cap…
    icon: arrow-up
    style: primary
    kind: task
    input: {placeholder: New total cap in USD for today (a number), max: 8}
    prompt: "The improvement engine hit its budget cap on UTC day {{day}}. Raise today's total cap to {{input}} USD. First check the value is a plain positive number (ignore a leading $ sign); if it is not, stop and say so. Then append one JSON row {\"date\": \"{{day}}\", \"lane\": \"total\", \"usd\": <that number>, \"why\": \"raised from the Inbox\"} to research/state/budget-overrides.jsonl in ~/code/hermes-coach-data, commit and push that repo, run `python3 ~/code/hermes-mods/skills/productivity/hermes-coach/scripts/engine_budget.py status`, then unblock today's stopped cards listed in research/state/budget-stops.jsonl (`hermes kanban --board hermes unblock <id>`). Report the new caps."
  - id: leave
    label: Leave paused
    icon: close
    kind: resolve
