name: backend-restart-guard
version: 0.1.0
description: "Refuses a bare `systemctl --user restart|stop` (or pkill) of the shared Hermes dashboard/gateway/serve backend from an agent; the restart must run through `hermes-sync pause-turns` so live Desktop turns pause at a step boundary instead of being cut."
author: daveey
provides_hooks:
  - pre_tool_call
