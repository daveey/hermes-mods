name: session-mentions
version: 0.1.0
description: >
  cross_session tool — list, read, and message Hermes sessions on ANY gateway connected to the
  Desktop app (this Mac, Nous-hosted, remote). cross_task tool — list, read, and comment on
  Kanban tasks on any of those gateways. The Desktop plugin
  ~/.hermes/desktop-plugins/session-mentions is the courier: it drains requests from
  /api/plugins/session-mentions/outbox and posts results back, so the Desktop must be running.
author: daveey (local)
provides_tools:
  - cross_session
  - cross_task
provides_hooks:
  - pre_llm_call
