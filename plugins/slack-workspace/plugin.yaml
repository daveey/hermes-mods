name: slack-workspace
version: 0.2.0
description: "Slack workspace awareness for a Hermes bot: observes every channel it is in (context injected on @-mention), joins channels in bulk, and calls any Web API method with read/act/admin tiers; anything sensitive goes to the bot's admins as one approve/always-allow/deny DM. Engagements hand a channel to a follower agent profile (exactly one reply per message, bot-loop cap, Inbox escalations)."
author: daveey
license: MIT
provides_hooks:
  - pre_llm_call
