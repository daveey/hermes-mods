name: slack-workspace
version: 0.1.0
description: "Slack workspace awareness for a Hermes bot: observes every channel it is in (context injected on @-mention), joins channels in bulk, and calls any Web API method with read/act/admin tiers; anything sensitive goes to the bot's admins as one approve/always-allow/deny DM."
author: daveey
license: MIT
provides_hooks:
  - pre_llm_call
