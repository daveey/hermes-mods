name: mcp-file-access
version: 0.1.0
description: "Ask before letting the Chrome DevTools MCP server read or write files outside its allowed folders; on approval (Once / Session / Always) the file is routed through the server's temp folder, so no restart is needed."
author: daveey
manifest_version: 1
kind: standalone
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
