name: denial-substitution-guard
version: 0.1.0
description: "Blocks re-running an AWS operation that was just denied (same action, same resource) under a different identity (other broker scope, profile or ambient role) or client (CLI, boto3, nested terminal) unless an independently verified grant exists. Ledger: $HERMES_HOME/denial-ledger.jsonl."
author: daveey
provides_hooks:
  - pre_tool_call
  - post_tool_call
