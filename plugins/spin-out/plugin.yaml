name: spin-out
version: 0.3.0
description: >
  Desktop: finds the follow-up work at the end of a session and offers it above the composer: launch each as a
  new session (brief + @session pointer to the parent), or put them on the active Kanban board as cards.
  Tells the parent session what was spun out (and where) so it stops offering it. Appears automatically when a turn ends with follow-up work, and on ⇧⌘F. Backend = dashboard/plugin_api.py
  (/plan, /kanban), aux model task "spin_out".
author: daveey
