name: session-outcome
version: 0.1.0
description: >
  Lets the agent declare how a chat ended with the session_outcome tool (done with a summary, a decision with
  choice buttons, or a wait on named work), so the sidebar paints from a stored outcome instead of idleness.
  Decisions land in the user-steps ledger. Registers a pool-model summary judge and an open-steps provider with
  core's hermes_state_outcome, and asks once for the call when a reply would end unresolved. A no-op on cores
  without hermes_state_outcome.
author: daveey
license: MIT
provides_hooks:
  - pre_final_gate
