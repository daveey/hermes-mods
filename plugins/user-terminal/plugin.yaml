name: user-terminal
version: 0.1.0
description: >
  run_in_user_terminal tool — instead of asking you to run a command, Hermes opens a terminal window
  (iTerm if installed, else Terminal.app, else cmux; HERMES_USER_TERMINAL=iterm|terminal|cmux to force), shows why + the exact command,
  you confirm with y in that terminal, it runs there (real TTY: sudo, logins work) and the exit code
  and output go back to the agent. macOS only.
author: daveey
provides_tools:
  - run_in_user_terminal
