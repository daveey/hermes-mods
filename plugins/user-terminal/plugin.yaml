name: user-terminal
version: 0.2.0
description: >
  run_in_user_terminal tool — instead of asking you to run a command, Hermes opens a terminal window
  (iTerm if installed, else Terminal.app, else cmux; HERMES_USER_TERMINAL=iterm|terminal|cmux to force), shows why + the exact command,
  it runs there right away (user_terminal.confirm: remote|all asks y/N first; real TTY: sudo, logins work) and the exit code
  and output go back to the agent. On a gateway with no screen (Linux/cloud) it relays the job to the
  owner's Mac (config user_terminal.device) through the session-mentions Desktop courier; owner sessions
  only (desktop/cli/tui/api_server). Mac side: dashboard routes /api/plugins/user-terminal/{start,status}.
author: daveey
provides_tools:
  - run_in_user_terminal
