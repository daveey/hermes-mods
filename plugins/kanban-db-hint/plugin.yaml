name: kanban-db-hint
version: 0.2.0
description: When a Kanban tool refuses a "corrupt" or unreliable board, appends the read-only check to run and the next step (stale backend view -> ask for a restart; real corruption -> don't repair the live file), and points a kanban_show "task not found" at cross_task, which reads other gateways' boards.
author: daveey
provides_hooks:
  - transform_tool_result
