name: llm-split
version: 0.1.0
description: >
  Quota vs traffic split between the subscription pools (Claude, GPT, Grok) for the Desktop titlebar chip. Reads each
  pool's weekly headroom and the model_routing provider weights; sets the weights by hand (drag) or keeps them
  following the quota (auto). Serves GET/PUT /api/plugins/llm-split/v1/split.
author: daveey
