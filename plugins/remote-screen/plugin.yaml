name: remote-screen
version: 0.1.0
description: >
  See and drive another Mac over macOS Screen Sharing (VNC) with no window on this Mac: remote_screenshot,
  remote_input (click/type/keys, by coordinates or on-screen text), and remote_approve_dialog, which approves
  permission prompts ("X would like to access ...") for allowlisted apps only, refuses password prompts, and
  keeps before/after screenshots. macOS controller (Vision OCR); target = any Mac with Screen Sharing on.
author: daveey
provides_tools:
  - remote_screen_hosts
  - remote_screenshot
  - remote_input
  - remote_approve_dialog
