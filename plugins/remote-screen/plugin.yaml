name: remote-screen
version: 0.2.0
description: >
  See and drive another Mac over macOS Screen Sharing (VNC) with no window on this Mac: remote_screenshot,
  remote_input (click/type/keys by explicit coordinates), and remote_approve_dialog, which only inspects
  possible permission prompts for exact allowlisted requesters. OCR never selects or clicks a target;
  permission approval needs user inspection. macOS controller (Vision OCR); target = any Mac with Screen Sharing on.
author: daveey
provides_tools:
  - remote_screen_hosts
  - remote_screenshot
  - remote_input
  - remote_approve_dialog
