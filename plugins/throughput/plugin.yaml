name: throughput
version: 0.1.0
description: >
  Per-minute throughput by gateway for the Desktop throughput chip + panel: tokens (in+out, cache) and sessions
  (started/ended) sampled every minute from this gateway's state.db files and the Board machine registry's
  counters, cards created/done from the Board replicas. Serves GET /api/plugins/throughput/v1/series.
author: daveey
