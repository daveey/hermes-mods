name: chat-closeout
version: 0.1.0
description: >
  A chat that hands its work to Kanban cards always shows what it waits on, and closes itself out when they
  finish: a per-chat waiting ledger stamped at every turn end (the sidebar row stays grey "waiting on N cards"
  until the closing answer lands), a turn-end lint that holds a "I'll report back" reply with nothing tracked
  behind it, an in-process wake that runs one close-out turn when the last card settles, and a 15-minute
  watchdog (Inbox item + WARNING) for chats whose results or close-out are stuck > 30 min.
author: daveey
provides_hooks:
  - post_llm_call
  - pre_llm_call
  - pre_final_gate
