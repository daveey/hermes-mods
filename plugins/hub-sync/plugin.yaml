name: hub-sync
version: 0.1.0
description: >
  REST over this gateway's hermes-hub replica (hub.db): every gateway's sessions, Inbox cards and Kanban cards
  with staleness, session -> owning gateway lookup, session -> Kanban links, and owner requests (rename/archive/
  pin a remote session, resolve a remote Inbox card, comment on a remote card) that queue locally when the hub
  is down. Read-only except for queuing requests; answers available:false when hermes-hub isn't installed.
