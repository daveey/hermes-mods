name: cpu-budget
version: 0.1.0
description: "Library + one-shot CLI (not a hook): detects a named service group burning more than a CPU budget while the host is affirmatively idle, from cumulative CPU-time deltas over two consecutive ten-minute windows, and opens one deduplicated agent-owned Kanban incident. Host config (service patterns, idle probes, sink) lives outside this repo."
author: daveey
