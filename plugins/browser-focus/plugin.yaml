name: browser-focus
version: 0.1.0
description: >
  When Hermes needs you to act in the Chrome it drives (sign in, 2FA, captcha, click), it brings that
  window and the right tab to the front: automatically when a browser_exec result shows a sign-in page
  or when the reply asks you to do something in the browser, plus a browser_focus tool. macOS.
author: daveey
provides_tools:
  - browser_focus
provides_hooks:
  - transform_tool_result
  - transform_llm_output
