name: runners
version: 0.2.0
description: Observe-only runner inventory with bounded supervised collection and authenticated cached API.
author: daveey
service: hermes-runners-collector.service
launchd_label: org.hermes.runners.collector
# Collection is read-only; no listening port or in-flight mutations to drain.
service_restart_safe: true
pip_dependencies:
  - PyYAML>=6,<7
  - jsonschema[format]>=4.23,<5
  - msgspec>=0.19,<1
