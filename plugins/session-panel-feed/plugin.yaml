name: session-panel-feed
version: 0.1.0
description: >
  Precomputes each watched chat's session-panel data (linked cards, finished cards, every waiting card's
  dependency chain) on the gateway and pushes what changed to the Desktop on the gateway event stream
  (plugin.session-panel-feed.changed), so switching chats paints the final panel with no requests.
