name: live-checkout-guard
version: 0.1.0
description: "Keeps agents from editing or mutating the live (synced) hermes-mods checkout in place: blocks patch/write_file, shell writes and git commit/stash/rebase/reset/checkout/... there, and points at a detached git worktree. Clean fast-forward merges, reads, fetch, worktree add and hermes-sync stay allowed. Also refuses HEAD moves and tracked-file writes in the live Hermes core checkout (~/.hermes/hermes-agent)."
author: daveey
provides_hooks:
  - pre_tool_call
