name: skill-outcomes
version: 0.2.0
description: >
  Logs one JSONL line per skill use to <HERMES_HOME>/logs/skill-outcomes.jsonl: {ts, host, session, skill,
  checks_first_pass, fix_rounds, user_correction}. Skills with a `## Done means` list get a one-line ask to end the
  reply with a `Done means (<skill>): p/t first pass, k fix rounds` tick-off, which fills the check fields; the
  session's next user message (coach's correction regex or judge events) fills user_correction.
author: daveey
license: MIT
provides_hooks:
  - post_tool_call
  - transform_tool_result
  - post_llm_call
  - pre_llm_call
  - pre_final_gate
