name: user-chat-probe-guard
version: 0.1.0
description: "Refuses an agent's one-shot `hermes chat --resume <id> -q/--oneshot/-z` into a person's chat (desktop, cli, messaging); names `hermes sessions branch <id>` so the probe runs on a hidden copy instead."
author: daveey
provides_hooks:
  - pre_tool_call
