name: stash-worktree-guard
version: 0.1.0
description: "Warns when `git stash` runs in a repo with more than one worktree (refs/stash is shared). In shared or unresolved repos, blocks every refs/stash mutation (stash push/save/store/pop/branch/drop/clear/import, raw update-ref/reflog/fetch/symbolic-ref writes) and cross-branch apply. Bounded analyzer, not a sandbox."
author: daveey
provides_hooks:
  - pre_tool_call
  - transform_terminal_output
