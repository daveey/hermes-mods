name: pool-llm
version: 0.1.0
description: Runs script/eval LLM calls on the Hermes subscription account pool (bin/hermes-pool-llm ask|serve|check), hints the pool on paid-key credit errors, and holds once an ask that the user buy API credit when the pool was never tried.
author: daveey
service: hermes-pool-llm.service   # systemd --user unit running `serve`; hermes-sync restarts it when idle after a plugin change
service_port: 8765
provides_hooks:
  - transform_terminal_output
  - transform_tool_result
  - pre_tool_call
