name: push-guard
version: 0.2.0
description: "Blocks direct `git push` of code to a guarded branch: merge-train guards allow only listed paths; require_check guards allow only a sha whose named CI check-run is success (also gates `gh pr merge --admin`). Config: $HERMES_HOME/push-guards.json."
author: daveey
provides_hooks:
  - pre_tool_call
