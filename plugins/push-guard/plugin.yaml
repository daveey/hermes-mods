name: push-guard
version: 0.4.0
description: "Blocks direct `git push` of code to a guarded branch: merge-train guards allow only listed paths; require_check guards allow only a sha whose named CI check-run is success (also gates `gh pr merge`, REST `PUT …/pulls/N/merge` via gh api/curl/Python, and refuses GraphQL merge mutations and `--auto`). Config: $HERMES_HOME/push-guards.json. On every host it also refuses a hand `gh run cancel` / `…/actions/runs/<id>/cancel` and names the attempt-checked ci_run_cancel.py."
author: daveey
provides_hooks:
  - pre_tool_call
