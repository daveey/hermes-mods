name: system-one
version: 0.1.0
description: >
  Shared client for System One decision models (TypeSafe Jev): typed yes/no, score and choice judgments in
  ~0.2 s for other plugins (coach, topic-shift, prompt-coach). Fail-open: any error returns None and the caller
  keeps its LLM path. Needs TYPESAFE_API_KEY. Library only: no tools or hooks.
author: daveey
