name: core-update
version: 0.1.0
description: >
  Serves the state of a core update prepared in the background ($HERMES_HOME/cache/core-update/state.json)
  to the core-update Desktop status-bar chip ("Building update…" / "Update ready — restart to apply"),
  and restarts Desktop so a waiting updater applies it between quit and relaunch.
author: daveey
