name: session-panel
version: 0.1.0
description: >
  Backend half of the Desktop session panel: precomputes each watched chat's panel data (linked cards, finished
  cards, every waiting card's dependency chain) on the gateway and pushes what changed on the gateway event stream
  (plugin.session-panel.changed), so switching chats paints the final panel with no requests.
