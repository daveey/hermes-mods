name: cpu-load-guard
version: 0.3.0
description: "On protected hosts (default: the user's laptop) refuses commands that saturate the CPU: one yes/stress-ng/busy loop per core, openssl speed -multi, xargs -P nproc burners. Points at hermes-hub or a deterministic test."
author: daveey
provides_hooks:
  - pre_tool_call
