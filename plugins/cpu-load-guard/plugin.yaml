name: cpu-load-guard
version: 0.3.3
description: "On protected hosts (default: the user's laptop and hermes-hub) refuses commands that saturate the CPU: one yes/stress-ng/Python busy-loop per core, openssl speed -multi, xargs -P nproc burners. Points at a deterministic test, not host saturation."
author: daveey
provides_hooks:
  - pre_tool_call
