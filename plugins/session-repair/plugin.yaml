name: session-repair
version: 0.1.0
description: >
  Finds chats whose Kanban cards are in weird or stuck states (ready while a worker is free, overdue wakes,
  unexplained waits, finished parents, stuck runs, idle reviews, broken chains, undelivered notices) with a
  read-only scanner; a 15-minute Hermes cron job hands new findings to one "Session repair" chat, which applies
  the safe fixes and files fix cards (skill broken-sessions). GET /api/plugins/session-repair/findings.
author: daveey
