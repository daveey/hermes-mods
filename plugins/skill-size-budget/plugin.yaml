name: skill-size-budget
version: 0.1.0
description: "Automatic skill edits (background review, curator) can't grow a SKILL.md body past 300 lines / 30,000 chars: the edit is refused with a recipe to put the material in references/<topic>.md (one hop deep) behind a one-line pointer, or a Done-means line. Foreground edits get a size_budget_warning only."
author: daveey
provides_hooks:
  - pre_tool_call
  - transform_tool_result
