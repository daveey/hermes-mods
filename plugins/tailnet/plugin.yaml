name: tailnet
version: 0.1.0
description: >
  tailnet_hosts, tailnet_exec, tailnet_copy: run commands on (and copy files to/from) the owner's tailnet machines
  over ssh with a key vended per call by the token broker (never in the model context or an agent sandbox). The
  owner's own Slack DM runs now on an auto-tier scope; any other turn opens a per-command approval request that
  DMs the owner host + command + requester. Audit jsonl plus a one-line audit in the thread. Inventory (hosts,
  owner ids) comes from a private hosts.yaml.
author: daveey
license: MIT
provides_tools:
  - tailnet_hosts
  - tailnet_exec
  - tailnet_copy
