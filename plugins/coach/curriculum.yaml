# coach curriculum: in-line feature reminders (Phase 3 of the power-user plan).
#
# One entry per feature you want to learn. The coach bus shows the tip (one panel, one button) when the live
# trigger fires, backs off when you dismiss it, and retires it for good once the miner sees the feature adopted.
# A private overlay at <HERMES_HOME>/coach/curriculum.yaml adds entries or overrides these by `id`
# (set `enabled: false` there to drop one).
#
#   id        stable key (state, logs, adoption.json)
#   feature   short name shown as the panel title
#   tip       one line; {repo} {n} {project} are filled from the trigger
#   try       optional: what the "Try it" button pre-fills in the composer (otherwise the button is "Got it")
#   commands  every `hermes ...` command the tip names; tests run `<command> --help` against the current build
#   trigger   live signal(s) the bus sees. A mapping = all conditions must hold; a list = any of the mappings.
#               text: regex on a user turn from the last 2 turns   list_items: N  (a turn with >= N list lines)
#               long_job: true   subagents: N   still_broken: N   min_msgs: N   source: [desktop, telegram, ...]
#               tool: {name: N}  (this session used the tool >= N times)   unless_tool: [names]
#               project_sessions: {n, days, match?}  (>= n sessions in this repo in the window)
#               concurrent: {n, minutes, match?}     (>= n sessions in this repo active in the last minutes)
#   adopted   default bar = KPI 5: used in >= 3 distinct interactive sessions in 14 days, unless the plan's
#             "done when" for that level says otherwise. Test the miner (coach_mine.py --write-adoption) evaluates over the digest repo. A mapping or
#             {any: [mappings]}. Fields: feature | tool | signal (name or list, summed), min (1), days (14),
#             unit (events | sessions), sources (interactive | [list]), match (regex on repo/cwd/title),
#             profile (regex), cwd (regex), min_msgs.

- id: project_bot
  feature: A Bot for your busiest project
  trigger:
    project_sessions: {n: 6, days: 14}
  tip: "Session #{n} on {project} in two weeks. Give it a Bot: `hermes profile create {project}` with its own SOUL.md, skills and routines, and one permanent chat."
  try: "Set up a Bot for {project}: create the profile, write its SOUL.md from what we keep re-explaining, and add a daily routine."
  commands: ["hermes profile create", "hermes profile describe"]
  adopted:
    unit: sessions
    min: 3
    profile: "^(?!default$)"
    sources: interactive

- id: kanban_max_runtime
  feature: Long jobs go on the board
  trigger:
    long_job: true
  tip: "A job this long belongs on a Kanban card with `max_runtime_seconds`: it survives restarts and pings you when done, and this chat stays free."
  try: "Move the long-running job to a Kanban card with max_runtime_seconds set, and end this turn."
  commands: ["hermes kanban create", "hermes kanban tail"]
  adopted:
    feature: kanban_create:max_runtime
    unit: sessions
    min: 3
    sources: interactive

- id: todo_checklist
  feature: Checklists live in todo
  trigger:
    list_items: 3
    unless_tool: [todo, todo_list, todo_write]
  tip: "Multi-step ask: have the agent track it with the todo tool, so nothing silently drops and you can see what's left."
  try: "Track the steps above with the todo tool and tick them off as you go."
  adopted:
    feature: todo
    unit: sessions
    min: 3
    sources: interactive

- id: cron_whenever
  feature: "\"Every time\" means cron"
  trigger:
    text: "(?i)\\b(every (day|morning|night|evening|hour|week|monday|sunday)|whenever|each time|every time|automatically)\\b"
  tip: "Recurring ask: make it a cron job (`hermes cron create`, or ask for a scheduled job) instead of remembering to ask again."
  try: "Turn this into a scheduled cron job and show me the schedule."
  commands: ["hermes cron create", "hermes cron list"]
  adopted:
    feature: cron_create
    unit: sessions
    min: 3
    sources: interactive

- id: worktree_parallel
  feature: Parallel edits in worktrees
  trigger:
    concurrent: {n: 2, minutes: 30}
  tip: "Two live sessions in {repo}: give each its own checkout (`hermes -w`, or a `worktree` Kanban card) so they never edit the same files."
  commands: ["hermes chat"]
  adopted:
    any:
      - {unit: sessions, min: 2, cwd: "/\\.worktrees/", sources: interactive}
      - {feature: [hermes_worktree, kanban_create:worktree], min: 2}

- id: session_mention
  feature: "@session instead of re-explaining"
  trigger:
    text: "(?i)(as (we|i) (discussed|said|did|found)|like (we|i) did|in (the|another|that|my) (other|previous|last|earlier) (session|chat)|last (session|time we)|remember (when|the))"
  tip: "Pointing at earlier work? Type @session and pick it: the agent reads that chat itself, so you don't have to re-explain."
  adopted:
    signal: session_mention
    unit: sessions
    min: 3
    sources: interactive

- id: kanban_l1_boards
  feature: "Kanban L1: follow-ups go on a board"
  trigger:
    text: "(?i)\\b(follow[- ]?ups?|next steps?|backlog|later on|for later|after (this|that)( is done)?|once (this|that) (is done|lands|works))\\b"
  tip: "Follow-ups belong on a board, not in this chat: one board per project (`hermes kanban boards create <project>`), then \"put these on the <project> board\"."
  try: "Put the open follow-ups from this session on the board as cards, each with a brief and a done-check."
  commands: ["hermes kanban boards create", "hermes kanban boards list", "hermes kanban show"]
  adopted:
    feature: [kanban_create, kanban_cli_create]
    min: 5
    sources: interactive

- id: kanban_l2_fanout
  feature: "Kanban L2: fan out as cards"
  trigger:
    any:
      - {subagents: 5}
      - {tool: {delegate_task: 3}}
  tip: "Fan-out work runs better as cards: one card per stream with `parents=[...]` into a synthesizer card (or `hermes kanban swarm`). Cards survive restarts; subagents die at ~12 min."
  try: "Re-plan this as Kanban cards: one card per stream plus a synthesizer card that depends on all of them."
  commands: ["hermes kanban swarm", "hermes kanban link"]
  adopted:
    any:
      - {feature: kanban_create:parents, min: 3, sources: interactive}
      - {feature: kanban_swarm, min: 1, sources: interactive}

- id: kanban_l3_review
  feature: "Kanban L3: a reviewer gates done"
  trigger:
    text: "(?i)(\\b(deploy|ship|release|roll ?out)\\b|you said (it was|it's|it is) (done|fixed|working)|is it (actually )?(done|deployed))"
  tip: "Deploy-type work: put it on a card with a done-check. The worker ends with `kanban_request_review`, and a reviewer approves it or sends it back with `request_changes`."
  commands: ["hermes kanban request-review", "hermes kanban request-changes"]
  adopted:
    feature: [kanban_request_review, kanban_request_changes]
    min: 3

- id: kanban_l3_goal_mode
  feature: "Kanban L3: goal_mode for fix-until-green"
  trigger:
    still_broken: 2
  tip: "Fix-until-green loop: a `goal_mode` card keeps its worker going until a judge sees the done-check pass, so you don't have to re-prompt."
  try: "Make this a goal_mode Kanban card with a concrete done-check (the test or command that must pass)."
  adopted:
    feature: kanban_create:goal_mode
    min: 3
    sources: interactive

- id: kanban_l4_triage
  feature: "Kanban L4: rough asks into triage"
  trigger:
    any:
      - {source: [telegram, slack, signal, whatsapp, imessage, sms, discord]}
      - {text: "(?i)\\b(when you get a chance|at some point|someday|rough idea|not urgent|no rush)\\b"}
  tip: "Rough ask? Drop it into triage (`hermes kanban create --triage`, or a triage card) and let `hermes kanban specify` / `decompose` turn it into real cards."
  commands: ["hermes kanban create", "hermes kanban specify", "hermes kanban decompose"]
  adopted:
    any:
      - {feature: kanban_create:triage, min: 3}
      - {feature: [kanban_specify, kanban_decompose], min: 2}

- id: kanban_l4_specialists
  feature: "Kanban L4: specialist assignees"
  trigger:
    tool: {kanban_create: 3}
  tip: "Cards are all going to `default`. Specialist profiles (reviewer, researcher, a project dev) with their own skills make better assignees: `hermes profile create` + `hermes profile describe` so the orchestrator can route."
  commands: ["hermes profile create", "hermes profile describe", "hermes kanban assignees"]
  adopted:
    feature: kanban_create:specialist
    min: 3
