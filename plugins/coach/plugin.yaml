name: coach
version: 0.1.0
description: >
  One nudge bus. Agent channel (hooks, invisible to the user): repeated failing command, sleep/poll loops,
  40 tool calls without a checkpoint, edits in the live Hermes checkout -> a hint in the tool result;
  HEAD moves / app repacks / `hermes update` in the live checkout are blocked before they run.
  User channel (desktop-plugins/coach): Restart clean, Spin out, Add a line, Move to board, File it once — one
  button each, at most 1 per session per 15 turns, dismissals mute/demote. Logs to <HERMES_HOME>/coach/log.jsonl.
  Backend = dashboard/plugin_api.py, aux task "coach".
author: daveey
provides_hooks:
  - pre_final_gate
  - pre_tool_call
  - pre_verify
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - transform_tool_result
