[pytest]
# Covers setup/call/teardown; do not wait for test-all's 1500s suite kill.
required_plugins = pytest-timeout>=2.4,<3
timeout = 120
# A Python signal handler cannot interrupt every C-level wait; use a timer
# thread as well as conftest's capture-safe native faulthandler watchdog.
timeout_method = thread
# A failed (including timed-out) test must surface its name/traceback before
# thousands of later cases can exhaust the outer suite deadline.
addopts = --maxfail=1
