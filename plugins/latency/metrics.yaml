# All durations and targets are milliseconds. Repository names live in sources.json.
metrics:
  - {id: ui.session_switch, label: Switch session, group: Using Hermes, kind: span, source: desktop, start: click, end: transcript_painted, unit: ms, target_p90: 250}
  - {id: ui.new_session, label: New session ready, group: Using Hermes, kind: span, source: desktop, start: click, end: composer_ready, unit: ms, target_p90: 500}
  - {id: turn_first, label: 'Turn: first reply', group: Using Hermes, kind: derived, source: state, start: typed_user, end: first_assistant, unit: ms, target_p90: 10000}
  - {id: turn_final, label: 'Turn: done', group: Using Hermes, kind: derived, source: state, start: typed_user, end: explicit_final, unit: ms, target_p90: 120000}
  - {id: tool_kanban_create, label: Create card, group: Using Hermes, kind: derived, source: state, start: kanban_create, end: tool_result, unit: ms, target_p90: 2000}
  - {id: tool_kanban_show, label: Read card status, group: Using Hermes, kind: derived, source: state, start: kanban_show, end: tool_result, unit: ms, target_p90: 1000}
  - {id: tool_cross_session, label: Message another session, group: Using Hermes, kind: derived, source: state, start: cross_session, end: tool_result, unit: ms, target_p90: 10000}
  - {id: card_queue, label: Card waits for worker, group: 'Cards & workers', kind: derived, source: kanban, start: created, end: claimed, unit: ms, target_p90: 120000}
  - {id: card_create_done, label: Card created → done, group: 'Cards & workers', kind: derived, source: kanban, start: created, end: completed, unit: ms, target_p90: 3600000}
  - {id: ci_core, label: Core CI, group: Ship, kind: derived, source: github.core, start: run_started_at, end: updated_at, workflow: .github/workflows/ci.yaml, unit: ms, target_p90: 600000}
  - {id: ci_mods_plugins, label: Mods plugin CI, group: Ship, kind: derived, source: github.mods, start: run_started_at, end: updated_at, workflow: .github/workflows/plugin-suites.yml, unit: ms, target_p90: 600000}
  - {id: ci_bb_validate, label: BB validate CI, group: Ship, kind: derived, source: github.client, start: run_started_at, end: updated_at, workflow: .github/workflows/validate.yml, unit: ms, target_p90: 900000}
  - {id: build_bb_macos_release, label: BB macOS release build, group: Ship, kind: derived, source: github.client, start: run_started_at, end: updated_at, workflow: .github/workflows/macos-release.yml, unit: ms, target_p90: 2700000}
  - {id: pr_core_open_merge, label: Core PR open → merged, group: Ship, kind: derived, source: github.core, start: pr_opened, end: pr_merged, unit: ms, target_p90: 3600000}
  - {id: pr_core_merge_deploy, label: Core merged → deployed, group: Ship, kind: derived, source: github.core, start: pr_merged, end: deployed, unit: ms, target_p90: 900000}
  - {id: pr_core_open_deploy, label: Core PR open → deployed, group: Ship, kind: derived, source: github.core, start: pr_opened, end: deployed, unit: ms, target_p90: 5400000}
  - {id: pr_mods_open_deploy, label: Mods PR open → deployed, group: Ship, kind: derived, source: github.mods, start: pr_opened, end: deployed, unit: ms, target_p90: 3600000}
