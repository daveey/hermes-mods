name: lanes
version: 0.1.0
description: >
  REST API for the Desktop lanes panel: target against actual share of worker time per project lane, backlog,
  throughput and estimated cost, and the controls (share, pause, daily admit budget, admit a held card).
  Serves /api/plugins/lanes/v1/lanes. Needs a core with `hermes kanban lanes`.
