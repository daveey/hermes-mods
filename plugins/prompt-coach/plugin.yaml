name: prompt-coach
version: 0.1.0
description: >
  Desktop: after you send a task request, a cheap model checks whether a more ambitious framing
  (Altitude / Depth / Range, after Felix Rieseberg) would get a much better result; if so a stronger
  model rewrites it and a panel above the composer offers Run in new session / Replace / Keep mine.
  Backend = dashboard/plugin_api.py (/check, /seed, /choice, /stats), aux tasks "prompt_coach" + "prompt_coach_rewrite".
author: daveey
