name: kanban-wait-chain-guard
version: 0.1.0
description: "Parking behind a parked card is not a started fix: kanban_link / kanban_block(dependency) / awaiting-card parks get a hint when the card waited on is itself parked behind another parked card or idle 24h+, and are refused once the waiting card has 20 runs without progress."
author: daveey
provides_hooks:
  - pre_tool_call
  - transform_tool_result
