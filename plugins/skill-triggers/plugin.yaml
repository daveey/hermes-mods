name: skill-triggers
version: 0.1.0
description: >
  When a tool call or tool result matches a trigger (a `token-broker` terminal command, a kanban_create /
  kanban_block call, a Cloudflare "Authentication error" result), append the governing skill's key section to
  that tool result once per session, unless the session already viewed the skill. Removes "forgot to load the
  skill" as a failure mode. Trigger table: triggers.yaml, user overrides in <HERMES_HOME>/skill-triggers.yaml.
author: daveey
provides_hooks:
  - transform_tool_result
