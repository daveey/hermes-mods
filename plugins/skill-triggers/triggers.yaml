# Trigger table. Each row: id, skill, sections, and one or more conditions (all given conditions must match):
#   tools:          tool names (exact) the row applies to
#   command_regex:  regex searched in the terminal `command` / execute_code `code` argument
#   result_regex:   regex searched in the tool result text
#   file:           optional reference path inside the skill dir (e.g. references/x.md): sections are read from it
#                   instead of SKILL.md, and only skill_view(name, file_path=<file>) silences the row.
# `sections` entries are heading texts (prefix match, case-insensitive) or the lead-in of a **bold** paragraph.
# Override or add rows in <HERMES_HOME>/skill-triggers.yaml (same row id replaces; `disabled: [id]` removes).
triggers:
  - id: token-broker-command
    skill: token-broker
    tools: [terminal, execute_code]
    command_regex: '\btoken-broker\b'
    sections:
      - Hard rules
      - A permission error is not a blocker for David

  - id: kanban-card-asks
    skill: kanban-orchestrator
    tools: [kanban_create, kanban_block]
    sections:
      - Card bodies for this user
      - Card mechanics for this user

  - id: cloudflare-auth-error
    skill: token-broker
    tools: [terminal, execute_code]
    result_regex: '"code"\s*:\s*10000\b|Authentication error'
    sections:
      - Getting a vendor credential that only a web UI can mint

  - id: vendor-403
    skill: token-broker
    tools: [terminal, execute_code]
    result_regex: '(?i)\bHTTP/[\d.]+\s+403\b|"status(?:_code)?"\s*:\s*403\b|\bHTTP(?: error)?\s+403\b'
    sections:
      - A permission error is not a blocker for David

  - id: user-terminal-handoff
    skill: asking-the-user
    tools: [run_in_user_terminal]
    sections:
      - Commands that need the user

  - id: chrome-focus-handoff
    skill: asking-the-user
    tools: [browser_focus]
    sections:
      - Chrome steps

  - id: remote-mac-gui
    skill: asking-the-user
    tools: [remote_approve_dialog, remote_screenshot, remote_input, remote_screen_hosts]
    sections:
      - Another Mac's GUI

  - id: inbox-post-shape
    skill: asking-the-user
    tools: [inbox_post]
    sections:
      - Inbox posts

  - id: git-worktree-add
    skill: hermes-mods-repo
    tools: [terminal, execute_code]
    command_regex: '\bworktree\s+add\b'
    sections:
      - Git worktrees

  - id: kanban-cli-create
    skill: kanban-orchestrator
    tools: [terminal, execute_code]
    command_regex: '\bhermes\s+kanban\s+create\b'
    sections:
      - Card mechanics for this user

  # One stack snapshot was reported as a CPU diagnosis (defect agent-44bc7b02a4): a dump is one instant, so the
  # result carries the rule to profile with `py-spy record` before blaming code for CPU. `sample <pid>` is macOS.
  - id: py-spy-dump-cpu
    skill: machine-investigate
    tools: [terminal, execute_code]
    command_regex: '\bpy-spy\s+dump\b|(?<![\w.-])sample\s+\d+\b'
    sections:
      - Live gateway stacks and restarts

  # ssh from the hub to a pool worker failed: the route is SSM, not "unreachable" (defect agent-cde19bf930).
  - id: worker-ssh-fail
    skill: launch-hub-worker
    tools: [terminal, execute_code]
    command_regex: '(?<![\w-])ssh(?![\w-])[^\n|;&]*\bhermes-worker-\d'
    result_regex: 'Permission denied \(publickey\)|Host key verification failed|Connection timed out'
    sections:
      - Run commands on existing workers from the hub with SSM

  # A personal account's budgets API is 404 whether or not budgets exist; an agent read it as "no budget set" and
  # told David so (defect agent-4638e42212). The fact lives in a reference file, so the row quotes that file and only
  # viewing that file (not a plain skill_view of the skill) counts as having read it.
  - id: github-personal-budgets-404
    skill: github-ci-wait
    file: references/actions-outages.md
    tools: [terminal, execute_code]
    command_regex: 'settings/billing/budgets'
    result_regex: '"status"\s*:\s*"?404|Not Found|HTTP 404'
    sections:
      - A 404 from `/users/<user>/settings/billing/budgets`
