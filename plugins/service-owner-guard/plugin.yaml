name: service-owner-guard
version: 0.1.0
description: "Refuses an agent's raw launchctl bootout/disable/unload/remove/stop, systemctl stop/disable/mask/kill or kill/pkill/killall of a service whose owner card is marked (OWNER.md or HERMES_OWNER_CARD), locally or over ssh, unless the command carries owner-approved=<card id>."
author: daveey
provides_hooks:
  - pre_tool_call
