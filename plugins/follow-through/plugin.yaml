name: follow-through
version: 0.1.0
description: >
  Deferred "when card X finishes, do Y" deliveries actually happen, once, and are reported honestly. Steers a
  parent that keeps a delivery for itself to schedule it as a dependent Kanban card; reminds a chat (quoting the
  recorded instruction) about completed child cards whose handoff is explicitly undelivered or whose completion
  notice never reached it; turns "did you send it?" into do-it-now; flags a send whose readback is empty as
  not verified.
author: daveey
provides_hooks:
  - pre_llm_call
  - transform_tool_result
