name: risk-log
version: 0.1.0
description: "Logs and counts high-risk tool use (dangerous terminal commands, credential-path reads, real-Chrome devtools, chat sends, spend/remote-exec MCP tools, token-broker vends) to a 0600 SQLite file. Metadata only; never blocks a call."
author: daveey
provides_hooks:
  - post_tool_call
