name: invisible-chrome-agent
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install pytest
        run: python -m pip install pytest
      - name: portable suite
        working-directory: skills/apple/invisible-chrome-agent/scripts
        env:
          # Socket paths must stay under the portable Unix limit. /tmp is rejected
          # as a TMPDIR, so pin HERMES_HOME to a short directory the fixture accepts.
          HERMES_HOME: /tmp/h
          TMPDIR: /tmp/h
        run: |
          mkdir -p /tmp/h/cache
          python -m pytest -q -p no:cacheprovider .
