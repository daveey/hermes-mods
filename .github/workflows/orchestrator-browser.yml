name: orchestrator-browser
on:
  pull_request:
    paths:
      - 'desktop-plugins/orchestrator/**'
      - 'plugins/orchestrator/**'
      - '.github/workflows/orchestrator-browser.yml'
  push:
    branches: [main]
    paths:
      - 'desktop-plugins/orchestrator/**'
      - 'plugins/orchestrator/**'
      - '.github/workflows/orchestrator-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-plugins/orchestrator/tests/package-lock.json
      - name: Install pinned browser test dependencies
        working-directory: desktop-plugins/orchestrator/tests
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: desktop-plugins/orchestrator/tests
        run: npx playwright install --with-deps chromium
      - name: Geometry, real CDP keyboard and action custody
        working-directory: desktop-plugins/orchestrator/tests
        run: npm test
