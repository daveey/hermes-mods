name: desktop-plugin-tests
# Public repository: run untrusted PR tests only on GitHub-hosted runners.
# These tests need React + jsdom, not a built/private Hermes desktop checkout.
on:
  push:
    branches: [main]
    paths:
      - 'desktop-plugins/**'
      - 'plugins/hub-sync/tests/fixtures/**'
      - '.github/workflows/desktop-plugin-tests.yml'
      - 'tests/test_desktop_plugin_ci.py'
  pull_request:
    paths:
      - 'desktop-plugins/**'
      - 'plugins/hub-sync/tests/fixtures/**'
      - '.github/workflows/desktop-plugin-tests.yml'
      - 'tests/test_desktop_plugin_ci.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install isolated desktop test dependencies
        env:
          HERMES_DESKTOP_DIR: ${{ runner.temp }}/desktop-test-deps
        run: |
          echo "HERMES_DESKTOP_DIR=$HERMES_DESKTOP_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HERMES_DESKTOP_DIR"
          printf '{"private":true}\n' > "$HERMES_DESKTOP_DIR/package.json"
          npm install --prefix "$HERMES_DESKTOP_DIR" --no-audit --no-fund \
            react@19.3.0 react-dom@19.3.0 jsdom@29.1.1 \
            @tanstack/react-query@5.104.1 radix-ui@1.7.0
          echo "HERMES_DESKTOP_PACKAGE=$HERMES_DESKTOP_DIR/package.json" >> "$GITHUB_ENV"
      - name: Run every desktop plugin test suite
        # No exclusions: every desktop-plugins/*/test/*.mjs and */tests/*.test.mjs
        # suite passes with the dependencies above. Keep the globs so new suites run too.
        run: node --test --test-concurrency=1 desktop-plugins/*/test/*.mjs desktop-plugins/*/tests/*.test.mjs
