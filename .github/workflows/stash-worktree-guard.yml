name: stash-worktree-guard
# The guard decides, on every host, whether an agent's terminal/execute_code call that may run
# `git stash pop|apply` is refused. Its suite (stdlib guard, pytest, real git repositories and
# bash) used to run only on a developer's machine; it now runs on every change, on the Python
# versions the Hermes runtimes use. Interpreters come from uv, as in live-checkout-guard.yml.
on:
  pull_request:
    paths:
      - 'plugins/stash-worktree-guard/**'
      - '.github/workflows/stash-worktree-guard.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/stash-worktree-guard/**'
      - '.github/workflows/stash-worktree-guard.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Guard suite
        working-directory: plugins/stash-worktree-guard
        run: |
          git --version
          bash --version | head -1
          uv run --no-project --python '${{ matrix.python }}' --with pytest -- \
            python -B -m pytest -q -p no:cacheprovider -rs tests_guard.py
