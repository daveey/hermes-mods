name: recurring-job-state
on:
  pull_request:
    paths: ['skills/devops/recurring-job-state/**', '.github/workflows/recurring-job-state.yml']
  push:
    branches: [main]
    paths: ['skills/devops/recurring-job-state/**', '.github/workflows/recurring-job-state.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: job_state.py unit tests
        run: python -B -m unittest discover -s skills/devops/recurring-job-state/tests -v
