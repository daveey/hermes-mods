name: recurring-job-state
on:
  pull_request:
    paths: ['skills/devops/recurring-job-state/**', '.github/workflows/recurring-job-state.yml']
  push:
    branches: [main]
    paths: ['skills/devops/recurring-job-state/**', '.github/workflows/recurring-job-state.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = macOS /usr/bin/python3 (launchd). ubuntu-latest (26.04) has no setup-python 3.9
        # build, so interpreters come from uv, as in stash-worktree-guard.yml.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: job_state.py unit tests
        run: uv run --no-project --python '${{ matrix.python-version }}' -- python -B -m unittest discover -s skills/devops/recurring-job-state/tests -v
