name: skill-tests
# Every skill's own tests (skills/<cat>/<name>/scripts/test_*.py and .../tests/test_*.py), one suite per
# skill dir via `scripts/test-all -k skills/`. Before this nothing ran them: a red hermes-coach askgate test
# sat on main unnoticed. No paths: filter, so a change to a shared plugin or script a skill imports still
# runs them. Core is not checked out here; suites that need it skip themselves, as on a fresh host.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreter
        run: |
          uv python install 3.14
          echo "HERMES_MODS_PYTHON=$(uv python find 3.14)" >> "$GITHUB_ENV"
      # invisible-chrome-agent's real stop/retirement suites need browser-harness (the runner has
      # google-chrome); under CI=true they fail, not skip, without it. Same pin as plugin-suites.yml.
      - name: Suite provisions (browser-harness)
        run: |
          uv tool install 'browser-harness==0.1.13'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Git identity for fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      # test-all adds the repo-guards suite (tests/) to every -k run, and its gitleaks history regression
      # (tests/test_plugin_suites_ci.py) fails under CI=true without the binary: the version gitleaks.yml
      # pins, sha256-checked, in a runner-temp dir on PATH (same shape as plugin-suites.yml).
      - name: Suite provisions (workflow-pinned gitleaks)
        run: |
          set -euo pipefail
          gl_version=8.28.0
          gl_sha256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          gl_tar="${RUNNER_TEMP}/gitleaks_${gl_version}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$gl_tar" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gl_version}/gitleaks_${gl_version}_linux_x64.tar.gz"
          echo "${gl_sha256}  ${gl_tar}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/tools"
          tar -xzf "$gl_tar" -C "${RUNNER_TEMP}/tools" gitleaks
          "${RUNNER_TEMP}/tools/gitleaks" version | grep -qx "$gl_version"
          echo "${RUNNER_TEMP}/tools" >> "$GITHUB_PATH"
      - name: Skill suites (scripts/test-all -k skills/)
        env:
          # invisible-chrome-agent's socket paths must stay under the Unix limit and it rejects /tmp itself
          # as TMPDIR (see invisible-chrome-agent.yml), so pin both to a short dir.
          HERMES_HOME: /tmp/h
          TMPDIR: /tmp/h
        run: |
          mkdir -p /tmp/h/cache
          scripts/test-all -k skills/ --list
          "$HERMES_MODS_PYTHON" scripts/test-all -k skills/ -j 4
