name: skill-tests
# Every skill's own tests (skills/<cat>/<name>/scripts/test_*.py and .../tests/test_*.py), one suite per
# skill dir via `scripts/test-all -k skills/`. Before this nothing ran them: a red hermes-coach askgate test
# sat on main unnoticed. No paths: filter, so a change to a shared plugin or script a skill imports still
# runs them. Core is not checked out here; suites that need it skip themselves, as on a fresh host.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreter
        run: |
          uv python install 3.14
          echo "HERMES_MODS_PYTHON=$(uv python find 3.14)" >> "$GITHUB_ENV"
      - name: Git identity for fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Skill suites (scripts/test-all -k skills/)
        env:
          # invisible-chrome-agent's socket paths must stay under the Unix limit and it rejects /tmp itself
          # as TMPDIR (see invisible-chrome-agent.yml), so pin both to a short dir.
          HERMES_HOME: /tmp/h
          TMPDIR: /tmp/h
        run: |
          mkdir -p /tmp/h/cache
          scripts/test-all -k skills/ --list
          "$HERMES_MODS_PYTHON" scripts/test-all -k skills/ -j 4
