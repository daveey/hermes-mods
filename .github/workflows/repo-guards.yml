name: repo-guards
# Repo-wide guard tests (tests/: sqlite mode=ro guard, commit-scope guard, pre-commit hook, test-all runner).
# They scan every plugin/skill, so they run on EVERY push and PR, with no paths: filter: a plugins/coach-only
# change once landed a bare mode=ro open on main because only per-plugin workflows matched its paths.
# Locally `scripts/test-all -k <plugin>` adds its `repo-guards` suite, but only when someone runs test-all;
# pushes that ran no tests (hermes-sync pushing local commits, a hand push) are caught only here.
# tests/test_repo_guards_ci.py pins this shape.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreter
        run: |
          uv python install '${{ matrix.python }}'
          echo "PY=$(uv python find '${{ matrix.python }}')" >> "$GITHUB_ENV"
      - name: Git identity for fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Provision workflow-pinned gitleaks for history regression
        run: |
          mkdir -p "${RUNNER_TEMP}/tools"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/tools" gitleaks
          echo "${RUNNER_TEMP}/tools" >> "$GITHUB_PATH"
      - name: Repo-wide guard tests (stdlib unittest)
        run: |
          "$PY" -c 'import sys; print(sys.version)'
          "$PY" -B -m unittest discover -v -s tests
