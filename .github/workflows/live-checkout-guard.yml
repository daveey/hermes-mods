name: live-checkout-guard
# The advertised helper invocation is an unqualified `python3`, which is Python 3.9 on stock
# macOS. The stash-retirement/reconcile helpers are stdlib-only, so they run on the oldest
# supported interpreter (3.9, see MIN_PYTHON) and the current managed one (3.14).
on:
  pull_request:
    paths:
      - 'plugins/live-checkout-guard/**'
      - '.github/workflows/live-checkout-guard.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/live-checkout-guard/**'
      - '.github/workflows/live-checkout-guard.yml'
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py39
        with:
          python-version: '3.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Stash retirement + reconcile helpers (stdlib only)
        working-directory: plugins/live-checkout-guard
        env:
          HERMES_MODS_PY39: ${{ steps.py39.outputs.python-path }}
        run: |
          python -c 'import sys; print(sys.version)'
          python -B -m unittest -v tests.test_stash_retirement tests.test_retirement_cli tests_reconcile
