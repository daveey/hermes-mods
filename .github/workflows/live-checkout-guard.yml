name: live-checkout-guard
# The advertised helper invocation is an unqualified `python3`, which is Python 3.9 on stock
# macOS. The stash-retirement/reconcile helpers are stdlib-only, so they run on the oldest
# supported interpreter (3.9, see MIN_PYTHON) and the current managed one (3.14).
# Interpreters come from uv: actions/setup-python has no 3.9 build for current ubuntu-latest.
on:
  pull_request:
    paths:
      - 'plugins/live-checkout-guard/**'
      - '.github/workflows/live-checkout-guard.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/live-checkout-guard/**'
      - '.github/workflows/live-checkout-guard.yml'
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreters
        run: |
          uv python install 3.9 '${{ matrix.python }}'
          echo "HERMES_MODS_PY39=$(uv python find 3.9)" >> "$GITHUB_ENV"
          echo "PY=$(uv python find '${{ matrix.python }}')" >> "$GITHUB_ENV"
      - name: Stash retirement + reconcile helpers (stdlib only)
        working-directory: plugins/live-checkout-guard
        run: |
          "$PY" -c 'import sys; print(sys.version)'
          "$HERMES_MODS_PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$PY" -B -m unittest -v tests.test_stash_retirement tests.test_retirement_cli tests_reconcile
