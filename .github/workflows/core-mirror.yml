name: Core mirror verifier fixtures
on:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/core-mirror.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core-mirror.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated Git fixture suites (verifier + coverage gate)
        run: python3 -B -m unittest discover -s core -p 'test_*.py' -v
      - name: Check existing documentation coverage
        run: python3 -B core/check_coverage.py
