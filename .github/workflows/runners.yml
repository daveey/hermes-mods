name: runners
on:
  pull_request:
    paths:
      - 'plugins/runners/**'
      - '.github/workflows/runners.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/runners/**'
      - '.github/workflows/runners.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest 'jsonschema[format-nongpl]' pyyaml fastapi httpx
      - name: Provision pinned core auth source
        run: |
          set -euo pipefail
          # test_api.py executes _require_token / _has_valid_session_token from
          # this file. Developer machines have it under ~/.hermes; runners do not.
          sha=ef75bc708867e3884cb40a91363be6dc6fddc034
          dest="${RUNNER_TEMP}/hermes-agent-web_server.py"
          curl -fsSL -o "$dest" \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/${sha}/hermes_cli/web_server.py"
          python - "$dest" <<'PY'
          import ast, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          names = {n.name for n in ast.parse(path.read_text()).body if isinstance(n, ast.FunctionDef)}
          missing = {"_require_token", "_has_valid_session_token"} - names
          if missing:
              raise SystemExit(f"pinned core auth source lacks {sorted(missing)}")
          PY
          echo "RUNNERS_CORE_WEB_SERVER=${dest}" >> "$GITHUB_ENV"
      - name: Runner plugin suite (fictional fixtures, no live runtime)
        run: python -m pytest -q -p no:cacheprovider plugins/runners/tests
