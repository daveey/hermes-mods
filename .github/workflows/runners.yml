name: runners
on:
  pull_request:
    paths:
      - 'plugins/runners/**'
      - '.github/workflows/runners.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/runners/**'
      - '.github/workflows/runners.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest 'jsonschema[format-nongpl]' pyyaml fastapi httpx
      - name: Runner plugin suite (fictional fixtures, no live runtime)
        run: python -m pytest -q -p no:cacheprovider plugins/runners/tests
