name: plugin-suites
# Every test-all suite (plugins/*, tools/*, skills/**, tests/) that a change touches, on the Python versions
# the Hermes runtimes use. Before this only five plugins with their own workflow ran in CI; the rest ran
# only when someone ran scripts/test-all by hand, so pushes that ran no tests (hermes-sync pushing local
# commits, hand pushes) landed red suites unnoticed (111 coach failures, 10-28).
#
# Selection: scripts/ci-plugin-suites select maps each changed path to its suite from `scripts/test-all
# --list` (plus suites whose code names a changed one); scripts/, tests/, lib/ or this file select all.
# The weekly schedule and workflow_dispatch run every suite. On the 3.14 leg (core's runtime Python) the public
# core mirror daveey/hermes-agent is checked out (main, or the workflow_dispatch core_ref the hub passes after each
# core move) and named in HERMES_CORE_CHECKOUT, so core-backed tests run here instead of on the hub. The 3.11 leg
# stays core-less: core gates its runtime dependencies on 3.14, so core-backed tests skip there.
# Push, PR and scheduled runs use core main as it is at run time: a core change alone can turn an unrelated
# hermes-mods PR red (rebase or fix the mod). The hub's dispatch pins core_ref to the exact core it deployed.
#
# GitHub-hosted only: this repo is public, and a self-hosted runner would run fork-PR code on our hosts.
# tests/test_plugin_suites_ci.py pins this shape.
# A hub dispatch is named for its core so hermes-hub's hub-core-mirror can find the run for the core it sent; every
# other event keeps GitHub's default title (commit message / PR title / workflow name).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('plugin-suites core={0}', inputs.core_ref || 'main') || github.event.head_commit.message || github.event.pull_request.title || github.workflow }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'daveey/hermes-agent commit or branch for the core-backed tests (hub: its deployed core sha)'
        required: false
        default: main
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  remote-card-composed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: daveey/hermes-agent
          # Core main 23f8b8c1 (2026-11-24, public mirror): core3994's card-answer and hermes_cli/kanban_release.py
          # for the Unblock click release. Not later: from bbdf6ba4 a stop's decision card is no longer filed by
          # ensure_producer and 3 decision-card release cases fail. Unrelated core observation still tracks main below.
          ref: 23f8b8c15aac788caddecf1d470fb0918e20dd3e
          path: .composed-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: daveey/hermes-hub
          # Landed courier190, client 1.9.59. No candidate/feature bytes.
          ref: 11058ac91990624059dd4214e420334cbcc5d006
          path: .composed-courier
          # Repository-scoped read-only deploy key, never a user/account token.
          ssh-key: ${{ secrets.HERMES_HUB_COMPOSED_READ_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Provision real composed runtime (Python 3.14)
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/.composed-core"
          uv sync --project "$core" --python 3.14 --locked --group dev --group test --quiet
          echo "HERMES_PYTHON=$core/.venv/bin/python" >> "$GITHUB_ENV"
          echo "HERMES_HUB_CLIENT_REAL=$GITHUB_WORKSPACE/.composed-courier/client/hermes_hub.py" >> "$GITHUB_ENV"
          echo "mods: $(git rev-parse HEAD)"
          echo "core: $(git -C "$core" rev-parse HEAD)"
          echo "courier: $(git -C .composed-courier rev-parse HEAD)"
          sha256sum .composed-courier/client/hermes_hub.py
      - name: Require guarded remote-card composed cases (zero skips)
        run: |
          set -euo pipefail
          bash plugins/user-steps/run-core-integration.sh "$GITHUB_WORKSPACE/.composed-core" \
            --remote-card-composed "$RUNNER_TEMP/remote-card-composed" -j 1
      - name: Upload composed case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-card-composed
          path: ${{ runner.temp }}/remote-card-composed
          if-no-files-found: error
          retention-days: 14
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreter
        run: |
          uv python install '${{ matrix.python }}'
          echo "HERMES_MODS_PYTHON=$(uv python find '${{ matrix.python }}')" >> "$GITHUB_ENV"
      # What suites need from CI, provisioned as their own workflows do: live-checkout-guard's
      # retirement CLI test runs on Python 3.9 (live-checkout-guard.yml); runners' test_api.py executes
      # core's auth helpers from a pinned public upstream web_server.py (runners.yml).
      # live-checkout-guard's real pre-commit publication tests (tests_skill_publish.py) need gitleaks:
      # the version gitleaks.yml pins, sha256-checked, in a runner-temp dir on PATH. That dir must stay off
      # the Desktop serve PATH those tests simulate (/usr/bin, /bin, ...). Under CI=true they fail, not skip,
      # without it (before this, 28 of them skipped and PR #61/#62's end-to-end proofs never ran here).
      - name: Suite provisions (Python 3.9, gitleaks, browser-harness, pinned core auth source)
        run: |
          set -euo pipefail
          uv python install 3.9
          echo "HERMES_MODS_PY39=$(uv python find 3.9)" >> "$GITHUB_ENV"
          gl_version=8.28.0
          gl_sha256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          gl_tar="${RUNNER_TEMP}/gitleaks_${gl_version}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$gl_tar" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gl_version}/gitleaks_${gl_version}_linux_x64.tar.gz"
          echo "${gl_sha256}  ${gl_tar}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/tools"
          tar -xzf "$gl_tar" -C "${RUNNER_TEMP}/tools" gitleaks
          "${RUNNER_TEMP}/tools/gitleaks" version | grep -qx "$gl_version"
          echo "${RUNNER_TEMP}/tools" >> "$GITHUB_PATH"
          # invisible-chrome-agent's real stop/retirement suites drive Chrome through browser-harness (PyPI,
          # MIT); the runner image has google-chrome but not it. Under CI=true they fail, not skip, without it.
          uv tool install 'browser-harness==0.1.13'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          sha=ef75bc708867e3884cb40a91363be6dc6fddc034
          dest="${RUNNER_TEMP}/hermes-agent-web_server.py"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$dest" \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/${sha}/hermes_cli/web_server.py"
          grep -q 'def _require_token' "$dest" && grep -q 'def _has_valid_session_token' "$dest"
          echo "RUNNERS_CORE_WEB_SERVER=${dest}" >> "$GITHUB_ENV"
      - name: Check out public core (3.14 leg)
        if: matrix.python == '3.14'
        env:
          CORE_REF: ${{ inputs.core_ref || 'main' }}
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/hermes-agent"
          git init -q "$core"
          git -C "$core" fetch -q --depth 1 -- https://github.com/daveey/hermes-agent.git "$CORE_REF"
          git -C "$core" checkout -q --detach FETCH_HEAD
          echo "core: daveey/hermes-agent $(git -C "$core" rev-parse HEAD) (ref $CORE_REF)"
          # Core's own venv, synced as the hub syncs it (hub-agent-venv-sync): suites and the child processes they
          # spawn import core's dependencies from it, exactly as on a host. test-all picks <core>/.venv/bin/python.
          uv sync --project "$core" --python '${{ matrix.python }}' --locked --group dev --group test --quiet
          echo "HERMES_CORE_CHECKOUT=${core}" >> "$GITHUB_ENV"
          echo "HERMES_MODS_PYTHON=${core}/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Git identity for fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Select suites
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) scripts/ci-plugin-suites select --base "$PR_BASE" > suites.txt ;;
            push) scripts/ci-plugin-suites select --base "$PUSH_BEFORE" > suites.txt ;;
            *) scripts/ci-plugin-suites select --all > suites.txt ;;
          esac
          echo "Selected suites:"
          cat suites.txt
      - name: Run selected suites (scripts/test-all --exact -k <suite>)
        env:
          # invisible-chrome-agent's socket paths must stay under the Unix limit and it rejects /tmp itself
          # as TMPDIR (see invisible-chrome-agent.yml), so pin both to a short dir.
          HERMES_HOME: /tmp/h
          TMPDIR: /tmp/h
          # Hosted Linux runners cannot read root-owned /proc entries as the test user.
          # Elevate only the existing read-only holder scanner, not pytest or cutover writes.
          SWAP_TEST_PRIVILEGED_SCAN: '1'
        run: |
          mkdir -p /tmp/h/cache
          if [ ! -s suites.txt ]; then
            echo "No test-all suite covers the changed paths; nothing to run."
            exit 0
          fi
          args=()
          while read -r s; do args+=(-k "$s"); done < suites.txt
          # Full per-suite logs (pytest's own output, public synthetic suite tests, never transcripts) are kept
          # for the failure-only upload below: the 40-line tail drowns failures under thousands of skip rows.
          logs="${RUNNER_TEMP}/suite-logs"
          mkdir -p "$logs"
          set +e
          # Keep all coach files, four total pytest workers and the existing per-suite deadline.
          "$HERMES_MODS_PYTHON" scripts/test-all --exact "${args[@]}" --coach-shards 2 -j 4 --json results.json --output-dir "$logs"
          rc=$?
          set -e
          echo
          if [ -f results.json ]; then
            scripts/ci-plugin-suites summary results.json || rc=1
            cp results.json "$logs/results.json"
          else
            echo "::error title=test-all::no results.json (exit $rc)"
            rc=1
          fi
          exit $rc
      - name: Upload full suite logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.python }}
          path: ${{ runner.temp }}/suite-logs
          retention-days: 14
          if-no-files-found: warn
