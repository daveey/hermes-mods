name: plugin-suites
# Every test-all suite (plugins/*, tools/*, skills/**, tests/) that a change touches, on the Python versions
# the Hermes runtimes use. Before this only five plugins with their own workflow ran in CI; the rest ran
# only when someone ran scripts/test-all by hand, so pushes that ran no tests (hermes-sync pushing local
# commits, hand pushes) landed red suites unnoticed (111 coach failures, 10-28).
#
# Selection: scripts/ci-plugin-suites select maps each changed path to its suite from `scripts/test-all
# --list` (plus suites whose code names a changed one); scripts/, tests/, lib/ or this file select all.
# The weekly schedule and workflow_dispatch run every suite. Core is private and not checked out, so
# core-backed tests skip here; the skipped column shows how many. The hub-side gate covers them.
#
# GitHub-hosted only: this repo is public, and a self-hosted runner would run fork-PR code on our hosts.
# tests/test_plugin_suites_ci.py pins this shape.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreter
        run: |
          uv python install '${{ matrix.python }}'
          echo "HERMES_MODS_PYTHON=$(uv python find '${{ matrix.python }}')" >> "$GITHUB_ENV"
      - name: Git identity for fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Select suites
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) scripts/ci-plugin-suites select --base "$PR_BASE" > suites.txt ;;
            push) scripts/ci-plugin-suites select --base "$PUSH_BEFORE" > suites.txt ;;
            *) scripts/ci-plugin-suites select --all > suites.txt ;;
          esac
          echo "Selected suites:"
          cat suites.txt
      - name: Run selected suites (scripts/test-all --exact -k <suite>)
        env:
          # invisible-chrome-agent's socket paths must stay under the Unix limit and it rejects /tmp itself
          # as TMPDIR (see invisible-chrome-agent.yml), so pin both to a short dir.
          HERMES_HOME: /tmp/h
          TMPDIR: /tmp/h
        run: |
          mkdir -p /tmp/h/cache
          if [ ! -s suites.txt ]; then
            echo "No test-all suite covers the changed paths; nothing to run."
            exit 0
          fi
          args=()
          while read -r s; do args+=(-k "$s"); done < suites.txt
          set +e
          "$HERMES_MODS_PYTHON" scripts/test-all --exact "${args[@]}" -j 4 --json results.json
          rc=$?
          set -e
          echo
          if [ -f results.json ]; then
            scripts/ci-plugin-suites summary results.json || rc=1
          else
            echo "::error title=test-all::no results.json (exit $rc)"
            rc=1
          fi
          exit $rc
