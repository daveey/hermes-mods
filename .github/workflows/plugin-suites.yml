name: plugin-suites
# Every test-all suite (plugins/*, tools/*, skills/**, tests/) that a change touches, on the Python versions
# the Hermes runtimes use. Before this only five plugins with their own workflow ran in CI; the rest ran
# only when someone ran scripts/test-all by hand, so pushes that ran no tests (hermes-sync pushing local
# commits, hand pushes) landed red suites unnoticed (111 coach failures, 10-28).
#
# Selection: scripts/ci-plugin-suites select maps each changed path to its suite from `scripts/test-all
# --list` (plus suites whose code names a changed one); scripts/, tests/, lib/ or this file select all.
# The weekly schedule and workflow_dispatch run every suite. Core is private and not checked out, so
# core-backed tests skip here; the skipped column shows how many. The hub-side gate covers them.
#
# GitHub-hosted only: this repo is public, and a self-hosted runner would run fork-PR code on our hosts.
# tests/test_plugin_suites_ci.py pins this shape.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install interpreter
        run: |
          uv python install '${{ matrix.python }}'
          echo "HERMES_MODS_PYTHON=$(uv python find '${{ matrix.python }}')" >> "$GITHUB_ENV"
      # What suites need from CI, provisioned as their own workflows do: live-checkout-guard's
      # retirement CLI test runs on Python 3.9 (live-checkout-guard.yml); runners' test_api.py executes
      # core's auth helpers from a pinned public upstream web_server.py (runners.yml).
      # live-checkout-guard's real pre-commit publication tests (tests_skill_publish.py) need gitleaks:
      # the version gitleaks.yml pins, sha256-checked, in a runner-temp dir on PATH. That dir must stay off
      # the Desktop serve PATH those tests simulate (/usr/bin, /bin, ...). Under CI=true they fail, not skip,
      # without it (before this, 28 of them skipped and PR #61/#62's end-to-end proofs never ran here).
      - name: Suite provisions (Python 3.9, gitleaks, pinned core auth source)
        run: |
          set -euo pipefail
          uv python install 3.9
          echo "HERMES_MODS_PY39=$(uv python find 3.9)" >> "$GITHUB_ENV"
          gl_version=8.28.0
          gl_sha256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          gl_tar="${RUNNER_TEMP}/gitleaks_${gl_version}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$gl_tar" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gl_version}/gitleaks_${gl_version}_linux_x64.tar.gz"
          echo "${gl_sha256}  ${gl_tar}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/tools"
          tar -xzf "$gl_tar" -C "${RUNNER_TEMP}/tools" gitleaks
          "${RUNNER_TEMP}/tools/gitleaks" version | grep -qx "$gl_version"
          echo "${RUNNER_TEMP}/tools" >> "$GITHUB_PATH"
          sha=ef75bc708867e3884cb40a91363be6dc6fddc034
          dest="${RUNNER_TEMP}/hermes-agent-web_server.py"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$dest" \
            "https://raw.githubusercontent.com/NousResearch/hermes-agent/${sha}/hermes_cli/web_server.py"
          grep -q 'def _require_token' "$dest" && grep -q 'def _has_valid_session_token' "$dest"
          echo "RUNNERS_CORE_WEB_SERVER=${dest}" >> "$GITHUB_ENV"
      - name: Git identity for fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Select suites
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) scripts/ci-plugin-suites select --base "$PR_BASE" > suites.txt ;;
            push) scripts/ci-plugin-suites select --base "$PUSH_BEFORE" > suites.txt ;;
            *) scripts/ci-plugin-suites select --all > suites.txt ;;
          esac
          echo "Selected suites:"
          cat suites.txt
      - name: Run selected suites (scripts/test-all --exact -k <suite>)
        env:
          # invisible-chrome-agent's socket paths must stay under the Unix limit and it rejects /tmp itself
          # as TMPDIR (see invisible-chrome-agent.yml), so pin both to a short dir.
          HERMES_HOME: /tmp/h
          TMPDIR: /tmp/h
          # Hosted Linux runners cannot read root-owned /proc entries as the test user.
          # Elevate only the existing read-only holder scanner, not pytest or cutover writes.
          SWAP_TEST_PRIVILEGED_SCAN: '1'
        run: |
          mkdir -p /tmp/h/cache
          if [ ! -s suites.txt ]; then
            echo "No test-all suite covers the changed paths; nothing to run."
            exit 0
          fi
          args=()
          while read -r s; do args+=(-k "$s"); done < suites.txt
          set +e
          "$HERMES_MODS_PYTHON" scripts/test-all --exact "${args[@]}" -j 4 --json results.json
          rc=$?
          set -e
          echo
          if [ -f results.json ]; then
            scripts/ci-plugin-suites summary results.json || rc=1
          else
            echo "::error title=test-all::no results.json (exit $rc)"
            rc=1
          fi
          exit $rc
