name: user-steps
on:
  pull_request:
    paths:
      - 'plugins/user-steps/**'
      - '.github/workflows/user-steps.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/user-steps/**'
      - '.github/workflows/user-steps.yml'
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install pytest pyyaml fastapi httpx
      - name: Standalone plugin suite (no Hermes core on PYTHONPATH)
        working-directory: plugins/user-steps
        run: python -m pytest -q -p no:cacheprovider tests
