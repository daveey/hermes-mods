skill: dogfood
should_load:
- ask: Can you poke around my staging site and try to break things? I want a list of bugs with screenshots as proof.
  source: generated
- ask: I just shipped a new checkout flow. Click through it like a real user, watch for console errors, and write up whatever
    looks broken.
  source: generated
- ask: Do a full QA pass on https://staging.example.com, focusing on signup and login, and save the report plus screenshots
    in ./qa-out.
  source: generated
near_miss:
- ask: Our web app's signup form throws a 500 when the email has a plus sign. Help me find the root cause in the code.
  instead: systematic-debugging
reviewed: false
