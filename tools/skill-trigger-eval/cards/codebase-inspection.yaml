skill: codebase-inspection
should_load:
- ask: Read through this research repo and tell me what's actually implemented versus just claimed in the README. Cite file
    paths, line ranges, and the commit SHA.
  source: session
- ask: Can you go through the repo's architecture and trace how data flows from input to saved results? Stay neutral, and
    separate verified results from speculation.
  source: generated
- ask: Who introduced the auto-approve behavior in our gateway? Follow the git history back to the original conversation and
    tell me which choices I approved.
  source: generated
near_miss:
- ask: Review this pull request on our repo and leave inline comments on anything risky in the diff.
  instead: github-code-review
reviewed: false
mined_from_sessions: 4
